name: Daglig AI-rapport (backup-trigger 06:00 CEST)

on:
  schedule:
    # 04:00 UTC = 06:00 CEST — körs som backup om Vercel Cron missar.
    # GitHub Actions scheduled workflows kan drabbas av upp till 2h fördröjning,
    # därför körs detta 2h före målklockan (08:00 CEST). Idempotency-guard i
    # morning-digest.ts säkerställer att mailen bara skickas en gång per dag.
    - cron: "0 4 * * *"
  workflow_dispatch: # Tillåter manuell körning från GitHub UI

jobs:
  send-digest:
    name: Generera och skicka daglig rapport
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Anropa morning-digest API
        run: |
          echo "Anropar https://aikostnad.se/api/morning-digest..."
          response=$(curl -s -w "\n%{http_code}" \
            -X GET "https://aikostnad.se/api/morning-digest" \
            --max-time 120)

          http_code=$(echo "$response" | tail -1)
          body=$(echo "$response" | sed '$d')

          echo "HTTP status: $http_code"
          echo "Response: $body"

          if [ "$http_code" -eq 200 ]; then
            echo "✅ Digest skickad!"
            echo "$body" | python3 -c "import sys,json; d=json.load(sys.stdin); print('Subject:', d.get('subject','?'))" 2>/dev/null || true
          else
            echo "❌ Fel: HTTP $http_code"
            echo "$body"
            exit 1
          fi

      - name: Rapport klar
        if: success()
        run: echo "Daglig AI-rapport skickad kl $(date +'%H:%M %Z')"
