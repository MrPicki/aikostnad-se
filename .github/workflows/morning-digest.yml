name: Daglig AI-rapport (08:00 CEST)

on:
  schedule:
    # 06:00 UTC = 08:00 CEST (sommartid) / 07:00 CET (vintertid)
    - cron: "0 6 * * *"
  workflow_dispatch: # Tillåter manuell körning från GitHub UI

jobs:
  send-digest:
    name: Generera och skicka daglig rapport
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Anropa morning-digest API
        id: call_api
        run: |
          echo "Anropar https://aikostnad.se/api/morning-digest..."
          response=$(curl -s -w "\n%{http_code}" \
            -X GET "https://aikostnad.se/api/morning-digest" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            --max-time 120)

          http_code=$(echo "$response" | tail -1)
          body=$(echo "$response" | sed '$d')

          echo "HTTP status: $http_code"
          echo "Response: $body"

          if [ "$http_code" -eq 200 ]; then
            echo "status=success" >> $GITHUB_OUTPUT
            echo "✅ Digest skickad!"
            echo "$body" | python3 -c "import sys,json; d=json.load(sys.stdin); print('Subject:', d.get('subject','?'))" 2>/dev/null || true
          else
            echo "status=failure" >> $GITHUB_OUTPUT
            echo "❌ Fel: HTTP $http_code"
            echo "$body"
            exit 1
          fi

      - name: Rapport klar
        if: success()
        run: echo "Daglig AI-rapport skickad kl $(date +'%H:%M %Z')"
