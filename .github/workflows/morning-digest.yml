name: Morning Digest Backup

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

concurrency:
  group: morning-digest
  cancel-in-progress: false

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger morning digest
        run: |
          curl -s -X GET https://aikostnad.se/api/morning-digest \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            --max-time 120
